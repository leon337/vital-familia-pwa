name: F02 | Real Chromium OCR gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'feat/f02-photo-capture', 'feat/f02-integrated-rc']

permissions:
  contents: read

concurrency:
  group: f02-browser-ocr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      SYNTHETIC_BACKEND_ENABLED: 'false'
      # Build-time opt-out for this synthetic gate; normal builds retain PWA registration.
      NEXT_PUBLIC_F02_E2E_DISABLE_SW: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-fund
      - name: Install pinned browser test runner (no repository lockfile change)
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install deterministic synthetic fixture font
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Build demo and self-hosted OCR assets
        run: npm run build
      - name: Record mandatory build identity and 42 public files
        run: node tests/browser/audit-artifacts.mjs build
      - name: Exercise real browser UI and Tesseract pixels on localhost
        run: npx playwright test --config tests/browser/playwright.config.mjs
      - name: Preserve allowlisted CSP chunk provenance (including failed tests)
        if: always()
        run: node tests/browser/csp-chunk-provenance.mjs
      - name: Collect and verify 42 public build files after browser execution
        run: node tests/browser/audit-artifacts.mjs collect
      - name: Verify mandatory green-run evidence and checksum manifest
        id: finalize
        run: node tests/browser/audit-artifacts.mjs finalize
      - name: Preserve synthetic fixtures, browser audit and failure traces
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: f02-chromium-ocr-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/f02/
            test-results/f02-build-receipt.json
            test-results/f02-build-provenance/
          if-no-files-found: error
          retention-days: 14
      - name: Bind GitHub artifact receipt to verified manifests
        if: ${{ success() && steps.finalize.outcome == 'success' && steps.evidence.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          {
            printf 'F02 public build provenance: 42/42 verified before upload\n\n'
            printf 'Run: %s; attempt: %s; commit: %s\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
            printf 'Artifact ID: %s\n\nSHA256 (GitHub ZIP): %s\n\nURL: %s\n\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL"
            sha256sum test-results/f02/manifest.json test-results/f02-build-receipt.json test-results/f02-build-provenance/receipt.json
          } >> "$GITHUB_STEP_SUMMARY"
